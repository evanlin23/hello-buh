# @HelloBuh auto-upload: one run a day uploads the day's 3 Shorts (YT_PER_DAY), each PRIVATE with a scheduled publish
# at a random time in its own slice of 9:00-21:00 Central, and on Sundays a weekly report issue with every video's views, engagement, retention and watch time. docs/upload-setup.md.
# OFF until set up: does nothing unless the YT_* secrets, the variable YT_CHANNEL_ID and the variable
# YT_ENABLED=true all exist. Pause any time by creating uploads/PAUSED on main.
# The clock: cron-job.org dispatches this workflow daily (GitHub's own schedule below is a backup; it has
# not fired reliably for this owner). Two runs on one day are harmless: the daily limit (YT_PER_DAY)
# (default 3) and the report's one-issue-per-day check stop doubles.
name: upload-short
on:
  schedule:
    - cron: '7 13 * * *'      # 7:07 AM Central (CST)
  workflow_dispatch:
    inputs:
      mode:
        description: "upload | report | scores | dry-run"
        required: false
        default: "upload"
      short:
        description: "upload this Short now instead of the next in uploads/queue.txt (blank = next)"
        required: false
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: upload-short
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      YT_ENABLED: ${{ vars.YT_ENABLED }}
      YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
      YT_PER_DAY: ${{ vars.YT_PER_DAY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: off unless enabled
        if: ${{ vars.YT_ENABLED != 'true' && inputs.mode != 'dry-run' }}
        run: echo "uploads are off (repo variable YT_ENABLED is not 'true'). Nothing done."
      - uses: actions/checkout@v4
        if: ${{ vars.YT_ENABLED == 'true' || inputs.mode == 'dry-run' }}
        with: { ref: main }
      - uses: actions/setup-python@v5
        if: ${{ vars.YT_ENABLED == 'true' || inputs.mode == 'dry-run' }}
        with: { python-version: "3.12" }
      - if: ${{ vars.YT_ENABLED == 'true' || inputs.mode == 'dry-run' }}
        run: pip install -q google-api-python-client google-auth
      - name: upload
        if: ${{ vars.YT_ENABLED == 'true' || inputs.mode == 'dry-run' }}
        run: |
          git config user.name evanlin23
          git config user.email 113861384+evanlin23@users.noreply.github.com
          # the daily run starts at a different minute each day (0-40 min late): no clockwork pattern
          if [ -z "${{ inputs.mode }}" ] || [ "${{ inputs.mode }}" = upload ] && [ -z "${{ inputs.short }}" ]; then
            d=$((RANDOM % 2400)); echo "starting in $((d / 60)) min"; sleep $d; git pull -q --rebase origin main || true
          fi
          case "${{ inputs.mode }}" in
            report)  python3 scripts/youtube_upload.py --report ;;
            dry-run) python3 scripts/youtube_upload.py --dry-run ;;
            scores)  python3 scripts/youtube_upload.py --scores ;;
            *)       python3 scripts/youtube_upload.py --short "${{ inputs.short }}" ;;
          esac
      - name: weekly report (Sundays, Central)
        if: ${{ vars.YT_ENABLED == 'true' && (inputs.mode == '' || inputs.mode == 'upload') }}
        continue-on-error: true
        run: |
          if [ "$(TZ=America/Chicago date +%u)" = 7 ]; then git pull -q --rebase origin main || true; python3 scripts/youtube_upload.py --report; fi
      - name: tell the owner it failed
        if: ${{ failure() }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "HelloBuh upload failed $(TZ=America/Chicago date +%F)" \
            --body "The daily upload run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Anything this run uploaded before it failed is recorded in uploads/uploads.json. Most common cause: the YouTube token expired (docs/upload-setup.md step 2)."
