# Renders a movie-engine Short (an AI-dilemma episode, docs/ai_dilemma.md) on parallel runners instead of one container.
# Triggered by pushing renders/job.json on a claude/* branch (scripts/queue_render.sh writes it with the recording and
# the voices; push triggers work from any branch, a Run-workflow button needs the file on main). 8 jobs each render
# one slice of the picture (scripts/ai_short.py --chunk i/8) and keep it as an artifact; one more job joins them and
# adds the sound, the score (CC0 orchestra samples, cached), the captions and the sidebar -> artifact "short".
name: render-movie
on:
  push:
    branches: ['claude/**']
    paths: ['renders/job.json']
  workflow_dispatch:
concurrency:
  group: render-movie-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: { chunk: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow==12.3.0 numpy==2.5.3
      - name: cache game files
        uses: actions/cache@v4
        with:
          path: |
            work/client
            work/assets
          key: mc-assets-${{ hashFiles('versions.env', 'renderer/build_assets.py', 'renderer/prepare.js') }}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: game assets
        run: |
          python3 scripts/fetch.py
          VER=$(grep '^MC_VERSION=' versions.env | cut -d= -f2)
          [ -f "work/assets/$VER/resolved.json" ] || { python3 renderer/build_assets.py "$VER" && node renderer/prepare.js "$VER"; }
      - name: the job
        id: job
        run: |
          EP=$(python3 -c "import json;print(json.load(open('renders/job.json'))['episode'])")
          ST=$(python3 -c "import json;print(json.load(open('episodes/$EP/episode.json'))['stunt'])")
          echo "ep=$EP" >> "$GITHUB_OUTPUT"
          gunzip -c "renders/$EP/$ST.rec.json.gz" > "work/$ST.rec.json"
      - name: render slice ${{ matrix.chunk }}
        run: python3 scripts/ai_short.py "episodes/${{ steps.job.outputs.ep }}" --chunk ${{ matrix.chunk }}/8
      - uses: actions/upload-artifact@v4
        with: { name: "seg-${{ matrix.chunk }}", path: "work/${{ steps.job.outputs.ep }}/segs/seg_*.mp4", retention-days: 3 }

  assemble:
    needs: frames
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: system deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow==12.3.0 numpy==2.5.3
      - name: cache game files and samples
        uses: actions/cache@v4
        with:
          path: |
            work/client
            work/assets
            work/sounds
            work/samples/x
          key: mc-assets-samples-${{ hashFiles('versions.env', 'renderer/build_assets.py', 'renderer/prepare.js', 'scripts/get_samples.sh') }}
      - run: npm ci --no-audit --no-fund
      - name: game assets and orchestra samples
        run: |
          python3 scripts/fetch.py
          VER=$(grep '^MC_VERSION=' versions.env | cut -d= -f2)
          [ -f "work/assets/$VER/resolved.json" ] || { python3 renderer/build_assets.py "$VER" && node renderer/prepare.js "$VER"; }
          ./scripts/get_samples.sh
          rm -f work/samples/dl/vsco.zip
      - name: the job
        id: job
        run: |
          EP=$(python3 -c "import json;print(json.load(open('renders/job.json'))['episode'])")
          ST=$(python3 -c "import json;print(json.load(open('episodes/$EP/episode.json'))['stunt'])")
          echo "ep=$EP" >> "$GITHUB_OUTPUT"; echo "st=$ST" >> "$GITHUB_OUTPUT"
          gunzip -c "renders/$EP/$ST.rec.json.gz" > "work/$ST.rec.json"
          mkdir -p "work/$EP/vox" && cp renders/$EP/vox/*.wav "work/$EP/vox/"
      - uses: actions/download-artifact@v4
        with: { pattern: "seg-*", path: segs, merge-multiple: true }
      - name: assemble
        run: |
          python3 scripts/ai_short.py "episodes/${{ steps.job.outputs.ep }}" --segments segs
          ffmpeg -v error -y -i "out/${{ steps.job.outputs.st }}.mp4" -c:v libx264 -crf 26 -vf scale=720:1280 -c:a aac -b:a 160k "out/${{ steps.job.outputs.st }}_preview.mp4"
      - uses: actions/upload-artifact@v4
        with: { name: short, path: "out/*.mp4", retention-days: 14 }
