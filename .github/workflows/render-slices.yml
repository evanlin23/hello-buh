# Renders a recording made in a session (work/<name>.rec.json) on GitHub's runners in parallel slices: ~12 min for a
# 60 s Short instead of ~25 in one container, and immune to the container's hourly restarts. docs/worker.md
# "Render on GitHub Actions".
#
# Queue with scripts/render_on_actions.sh <name> [stunt]: it commits the gzipped recording (renders/slices/<name>.rec.json.gz)
# and the job (renders/slices.json) on top of your HEAD, with your uncommitted stunts/, lib/ and stories/, and
# force-pushes that to the branch render/<name>. The push starts this workflow (push triggers work from any branch;
# the Run-workflow button needs this file on main). Jobs:
#   plan     reads the job and counts the frames
#   slice    N runners (default 16, at most 32) each render one contiguous range of frames with render.js FRAMES=
#            and keep it as a lossless RGB video (artifact seg-<i>). The ranges are cut to about equal render TIME
#            (scripts/render_cost.py), not equal length: a stretch of relights / sky-light re-meshes gets short slices
#            (skipped when renders/slices.json has reuse_run and that run's seg-* artifacts still exist: `hb render
#            --reuse` when only the edit changed; finish then downloads that run's slices)
#   finish   decodes the slices back into work/<name>.frames/, then audio + replay/slow-mo + edit
#            (scripts/finish_render.sh), uploads out/<name>.mp4 (artifact "short") and commits it to the render
#            branch as renders/out/<name>.mp4 with renders/result.json, so `render_on_actions.sh --fetch <name>`
#            gets it back with plain git (no gh token needed)
#   check    in parallel with the slices (no wall-clock added): ./hb check on the recording (motion lint, rec_check with
#            the cast and sight sections, lint, continuity, framing, owner, cuts, caption sync, on-screen sound) ->
#            artifact "check" (renders/out/<name>.check.json + .txt). Never fails the run.
#            finish then burns "CHECK FAILED: <n> blockers" (or "CHECK DID NOT RUN") over the top of the Short when it
#            has blockers (scripts/check_label.py; a ~30 s re-encode only then) and commits the report beside the mp4,
#            so no preview reaches the owner with an unflagged known blocker (2026-11-10)
#   failed   on any failure: renders/result.json says so, with the run's URL
name: render-slices
on:
  push:
    branches-ignore: [main, videos]
    paths: ['renders/slices.json']
  workflow_dispatch:
    inputs:
      name:
        description: recording name (renders/slices/<name>.rec.json.gz on this ref); empty = from renders/slices.json
        default: ""
      stunt:
        description: stunt module (stunts/<stunt>.js); empty = from renders/slices.json, else the name
        default: ""
      slices:
        description: number of parallel slices (at most 32); empty = from renders/slices.json, else 16
        default: ""
concurrency:
  group: render-slices-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read     # list and download an earlier run's seg-* artifacts (reuse_run)
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      name: ${{ steps.plan.outputs.name }}
      stunt: ${{ steps.plan.outputs.stunt }}
      fps: ${{ steps.plan.outputs.fps }}
      frames: ${{ steps.plan.outputs.frames }}
      n: ${{ steps.plan.outputs.n }}
      matrix: ${{ steps.plan.outputs.matrix }}
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - name: plan
        id: plan
        env: { IN_NAME: "${{ inputs.name }}", IN_STUNT: "${{ inputs.stunt }}", IN_SLICES: "${{ inputs.slices }}", GITHUB_TOKEN: "${{ github.token }}" }
        run: python3 scripts/render_slices.py plan >> "$GITHUB_OUTPUT"

  slice:
    needs: plan
    # skipped when the job reuses an earlier run's frames (renders/slices.json reuse_run: only the edit changed)
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      NAME: ${{ needs.plan.outputs.name }}
      FPS: ${{ needs.plan.outputs.fps }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/render-setup
      - name: render slice ${{ matrix.i }} of ${{ needs.plan.outputs.n }} (frames ${{ matrix.a }}-${{ matrix.b }})
        run: |
          gunzip -c "renders/slices/$NAME.rec.json.gz" > "work/$NAME.rec.json"
          python3 scripts/render_slices.py slice ${{ matrix.a }} ${{ matrix.b }}
      - uses: actions/upload-artifact@v4
        with: { name: "seg-${{ matrix.i }}", path: "work/segs/*.mkv", retention-days: 3, compression-level: 0, if-no-files-found: error }

  check:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true   # a flag for the preview, never a reason to lose the render
    env:
      NAME: ${{ needs.plan.outputs.name }}
      STUNT: ${{ needs.plan.outputs.stunt }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/render-setup
      - name: hb check on the recording (no server needed)
        run: |
          gunzip -c "renders/slices/$NAME.rec.json.gz" > "work/$NAME.rec.json"
          mkdir -p renders/out
          ./hb check "$STUNT" --rec "work/$NAME.rec.json" --report "renders/out/$NAME.check.json" || echo "check exit $?"
          cat "renders/out/$NAME.check.txt" || echo "no report"
      - uses: actions/upload-artifact@v4
        with: { name: check, path: "renders/out/*.check.*", retention-days: 14, if-no-files-found: warn }

  finish:
    needs: [plan, slice, check]
    if: always() && needs.plan.result == 'success' && (needs.slice.result == 'success' || needs.slice.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NAME: ${{ needs.plan.outputs.name }}
      STUNT: ${{ needs.plan.outputs.stunt }}
      FPS: ${{ needs.plan.outputs.fps }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/render-setup
        with: { extra-cache: "true" }
      - name: sound effects
        run: python3 scripts/fetch_sfx.py || echo "fetch_sfx failed, the edit uses its fallbacks"
      - name: the mood score (a story's edit mixes it in; docs/audio.md)
        run: python3 scripts/fetch_music.py || echo "fetch_music failed, a story edit without its track prints NO MUSIC"
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse == ''
        with: { pattern: "seg-*", path: work/segs, merge-multiple: true }
      - name: the reused frames (run ${{ needs.plan.outputs.reuse }})
        if: needs.plan.outputs.reuse != ''
        uses: actions/download-artifact@v4
        with: { pattern: "seg-*", path: work/segs, merge-multiple: true, run-id: "${{ needs.plan.outputs.reuse }}", github-token: "${{ github.token }}" }
      - name: join the slices
        run: |
          gunzip -c "renders/slices/$NAME.rec.json.gz" > "work/$NAME.rec.json"
          python3 scripts/render_slices.py join ${{ needs.plan.outputs.frames }}
      - name: audio, replay, edit
        run: scripts/finish_render.sh "$NAME" "$STUNT"
      - name: the check report (the parallel check job)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: check, path: renders/out }
      - name: label the Short with its check verdict (CHECK FAILED / DID NOT RUN)
        run: |
          R="renders/out/$NAME.check.json"; [ -f "$R" ] || R=""
          python3 scripts/check_label.py "out/$NAME.mp4" $R
          cp "out/$NAME.check.txt" "renders/out/$NAME.check.txt"
          cat "renders/out/$NAME.check.txt"
      - uses: actions/upload-artifact@v4
        with: { name: short, path: "out/${{ needs.plan.outputs.name }}.mp4", retention-days: 14, if-no-files-found: error }
      - name: commit the Short to the render branch
        if: github.ref_type == 'branch' && github.ref_name != 'main'
        run: |
          mkdir -p renders/out
          cp "out/$NAME.mp4" "renders/out/$NAME.mp4"
          python3 scripts/render_slices.py result done "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git config user.name github-actions[bot]
          git config user.email 41898299+github-actions[bot]@users.noreply.github.com
          git add -f renders/out renders/result.json
          git commit -qm "render-slices: out/$NAME.mp4 [skip ci]"
          # only ever a render branch (scripts/render_on_actions.sh queues on render/<name>, <prefix>/render-<name> or
          # <branch>-render-<name>): a job queued straight on a working branch reports to render/<name>, so the working
          # branch is never written. Matched by the exact names, not "render" anywhere: agent/render-speed is a working branch
          case "$GITHUB_REF_NAME" in render/*|*/render-"$NAME"|*-render-"$NAME") OUT_BRANCH=$GITHUB_REF_NAME; F="" ;; *) OUT_BRANCH=render/$NAME; F="-f" ;; esac
          git push $F origin "HEAD:refs/heads/$OUT_BRANCH" || echo "the branch moved on (re-queued?): the Short is still the 'short' artifact"

  failed:
    needs: [plan, slice, finish]
    if: failure() && github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: record the failure on the render branch
        run: |
          python3 scripts/render_slices.py result failed "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git config user.name github-actions[bot]
          git config user.email 41898299+github-actions[bot]@users.noreply.github.com
          git add -f renders/result.json
          git commit -qm "render-slices: failed [skip ci]"
          NAME=$(python3 -c "import json;print(json.load(open('renders/slices.json'))['name'])" 2>/dev/null || echo unknown)
          case "$GITHUB_REF_NAME" in render/*|*/render-"$NAME"|*-render-"$NAME") git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" || true ;; *) git push -f origin "HEAD:refs/heads/render/$NAME" || true ;; esac
