# Renders one Short end to end on a free runner and keeps the MP4 as an artifact.
# Manual for now (Actions tab -> render -> Run workflow). Uploads come later (see README).
name: render
on:
  workflow_dispatch:
    inputs:
      caption:
        description: caption in the top band
        default: "water bucket clutch 💀"
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: system deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
          pip install pillow==12.3.0 numpy==2.5.3
      - name: cache game files and sounds
        uses: actions/cache@v4
        with:
          path: |
            work/server/server.jar
            work/client
            work/assets
            work/sounds
            work/emoji
          key: mc-${{ hashFiles('versions.env') }}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: render
        env: { CAPTION: "${{ inputs.caption }}" }
        run: ./run.sh
      - uses: actions/upload-artifact@v4
        with: { name: short, path: out/*.mp4, retention-days: 14 }
