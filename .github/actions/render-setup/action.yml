# Shared runner setup for the render workflows (render-slices.yml): Java (build_assets runs the server jar's data
# generator), node + npm ci, ffmpeg, fonts, pillow/numpy, Chromium for render.js, and the game files (client jar,
# asset index, the renderer's extracted assets), cached by version and asset-script hash. `extra-cache: true` also
# caches what the edit pulls lazily (sounds, emoji, Mixkit sfx).
name: render-setup
description: Java, node, ffmpeg, Chromium and the cached Minecraft assets for render.js / audio.py / edit.py
inputs:
  extra-cache:
    description: also cache work/sounds, work/emoji and sfx/mixkit (the audio + edit job)
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with: { distribution: temurin, java-version: "21" }
    - uses: actions/setup-node@v4
      with: { node-version: "22", cache: npm }
    # No apt: the runners' Ubuntu mirror ran at ~119 kB/s on some runners (a slice spent 14 min installing ffmpeg,
    # the finish job 15 of its 21 min in setup; pipeline test 2026-11-10). ffmpeg (static, GitHub release), Inter
    # (GitHub release) and Playwright's Chromium come from fast hosts and are cached. DejaVu is on the image.
    - name: cache ffmpeg, Inter and Chromium
      uses: actions/cache@v4
      with:
        path: |
          ~/hb-tools
          ~/.cache/ms-playwright
        key: hb-tools-v1-${{ hashFiles('package-lock.json') }}
    - name: system deps (ffmpeg, Inter, pillow, numpy)
      shell: bash
      run: |
        T=~/hb-tools; mkdir -p $T
        if [ ! -x $T/ffmpeg/bin/ffmpeg ]; then
          curl -sSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p $T/ffmpeg && tar -xJf /tmp/ff.tar.xz -C $T/ffmpeg --strip-components=1
        fi
        echo "$T/ffmpeg/bin" >> "$GITHUB_PATH"
        if [ ! -f $T/Inter-ExtraBold.otf ]; then
          curl -sSL --retry 3 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o -j /tmp/inter.zip 'extras/otf/Inter-ExtraBold.otf' -d $T
        fi
        sudo mkdir -p /usr/share/fonts/opentype/inter && sudo cp $T/Inter-ExtraBold.otf /usr/share/fonts/opentype/inter/
        $T/ffmpeg/bin/ffmpeg -version | head -1
        pip install -q pillow==12.3.0 numpy==2.5.3
    - name: cache game files
      if: inputs.extra-cache != 'true'
      uses: actions/cache@v4
      with:
        path: |
          work/server/server.jar
          work/client
          work/assets
        key: mc-assets-${{ hashFiles('versions.env', 'renderer/build_assets.py', 'renderer/prepare.js') }}
    - name: cache game files, sounds and sfx
      if: inputs.extra-cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          work/server/server.jar
          work/client
          work/assets
          work/sounds
          work/emoji
          sfx/mixkit
          songs/score
        key: mc-edit-${{ hashFiles('versions.env', 'renderer/build_assets.py', 'renderer/prepare.js', 'sfx/mixkit/manifest.json', 'music/score.json') }}
        restore-keys: mc-assets-${{ hashFiles('versions.env', 'renderer/build_assets.py', 'renderer/prepare.js') }}
    - shell: bash
      run: npm ci --no-audit --no-fund
    - shell: bash
      run: |
        npx playwright install chromium   # no --with-deps (apt): the image has Chrome's libraries already
        node -e "require('playwright').chromium.launch().then(b => b.close()).then(() => console.log('chromium ok'))" \
          || npx playwright install-deps chromium   # only if a launch fails
    - name: game assets
      shell: bash
      run: |
        python3 scripts/fetch.py
        VER=$(grep '^MC_VERSION=' versions.env | cut -d= -f2)
        [ -f "work/assets/$VER/resolved.json" ] || { python3 renderer/build_assets.py "$VER" && node renderer/prepare.js "$VER"; }
